[package]
name = "aero-client"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
image = { version = "0.24", features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = "0.4"
[profile.dev.package.objc2]
debug-assertions = false

[profile.release.package.objc2]
debug-assertions = false
